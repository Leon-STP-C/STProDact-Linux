services:

  backend:
    build: .
    ports:
      - '3000:3000' # Host port : Internal container port

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/home/leon/testdata

volumes:
  postgres_data:


